<!DOCTYPE html>
<html lang="gl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bancos para sentar</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=1">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div id="app" class="max-w-6xl mx-auto px-4 py-8">
    <!-- Login -->
    <section id="loginView" class="min-h-screen flex items-center justify-center px-4 py-10">
      <div class="w-full max-w-md">
        <div class="text-center mb-8">
          <div class="mx-auto w-20 h-20 rounded-2xl bg-gradient-to-br from-emerald-400 via-teal-500 to-indigo-600 flex items-center justify-center shadow-2xl">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-11 h-11 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 14h16"></path>
              <path d="M6 14V8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v6"></path>
              <path d="M6 14v4"></path>
              <path d="M18 14v4"></path>
            </svg>
          </div>
          <h1 class="text-4xl font-extrabold tracking-tight mt-5 bg-gradient-to-r from-emerald-500 to-indigo-600 bg-clip-text text-transparent">BenchMarks</h1>
          <p class="text-slate-500 mt-2">Descubre, valora y comparte los mejores bancos</p>
        </div>

        <div class="bg-white/90 backdrop-blur-xl rounded-3xl shadow-2xl p-8 border border-white/40">
          <div class="flex mb-6 rounded-xl bg-slate-100 p-1">
            <button type="button" id="tabLogin" class="flex-1 py-2 rounded-lg text-sm font-medium bg-white shadow text-slate-900">Iniciar sesión</button>
            <button type="button" id="tabRegister" class="flex-1 py-2 rounded-lg text-sm font-medium text-slate-500">Crear cuenta</button>
          </div>

          <form id="loginForm" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1">Usuario</label>
              <input id="username" class="w-full border rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-400 outline-none" placeholder="userID" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1">Contrasinal</label>
              <input id="password" type="password" class="w-full border rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-400 outline-none" placeholder="••••••••" required>
            </div>
            <button class="w-full bg-gradient-to-r from-emerald-500 to-indigo-600 text-white rounded-xl py-3 font-semibold hover:opacity-90 transition">Entrar</button>
          </form>

          <form id="registerForm" class="space-y-4 hidden">
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1">Usuario</label>
              <input id="rUsername" class="w-full border rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-400 outline-none" placeholder="userID" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1">Nome</label>
              <input id="rName" class="w-full border rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-400 outline-none" placeholder="O teu nome" required>
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-600 mb-1">Contrasinal</label>
              <input id="rPassword" type="password" class="w-full border rounded-xl px-4 py-3 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-400 outline-none" placeholder="••••••••" required>
            </div>
            <button class="w-full bg-gradient-to-r from-emerald-500 to-indigo-600 text-white rounded-xl py-3 font-semibold hover:opacity-90 transition">Crear conta</button>
          </form>

          <div id="loginMsg" class="mt-4 text-sm text-red-600"></div>
        </div>
      </div>
    </section>

    <!-- App -->
    <section id="appView" class="hidden">
      <header class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-3xl font-bold">Bancos para sentar</h1>
          <p class="text-slate-500" id="whoami"></p>
        </div>
        <button id="logoutBtn" class="bg-slate-800 text-white px-4 py-2 rounded hover:bg-black">Pechar sesión</button>
      </header>

      <nav class="flex gap-2 mb-6">
        <button class="tabBtn bg-blue-600 text-white px-4 py-2 rounded" data-tab="benches">Bancos</button>
        <button class="tabBtn bg-slate-200 px-4 py-2 rounded" data-tab="favorites">Favoritos ⭐</button>
        <button class="tabBtn bg-slate-200 px-4 py-2 rounded" data-tab="profile">Perfil</button>
      </nav>

      <!-- Benches -->
      <div id="benchesTab" class="tabContent space-y-4">
        <div class="bg-white shadow rounded-xl p-4">
          <h2 class="font-semibold mb-3">Engadir banco</h2>
          <form id="benchForm" class="flex flex-wrap gap-2 items-start">
            <input id="benchCords" class="border rounded px-3 py-2 flex-1" placeholder="Coordenadas (lat,lon)" required>
            <input id="benchType" class="border rounded px-3 py-2 flex-1" placeholder="Tipo" required>
            <label class="flex flex-col text-sm text-slate-600">
              <span class="mb-1">Foto do dispositivo</span>
              <input id="benchPhoto" type="file" accept="image/*" class="border rounded px-3 py-1.5 bg-slate-50">
            </label>
            <img id="benchPhotoPreview" class="hidden w-16 h-16 object-cover rounded border" alt="Previsualización">
            <button class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Engadir</button>
          </form>
        </div>
        <div class="bg-white shadow rounded-xl p-4">
          <h2 class="font-semibold mb-3">Listado (ordenado por likes)</h2>
          <div id="benchGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
      </div>
      <!-- Favorites Tab -->
      <div id="favoritesTab" class="tabContent hidden space-y-4">
        <div class="bg-white shadow rounded-xl p-4">
          <h2 class="font-semibold mb-3">Os meus bancos favoritos ⭐</h2>
          <div id="favoriteGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
      </div>

      <!-- Profile -->
      <div id="profileTab" class="tabContent hidden space-y-4">
        <div class="bg-white shadow rounded-xl p-4">
          <h2 class="font-semibold mb-3">Editar perfil</h2>
          <form id="profileForm" class="grid grid-cols-1 md:grid-cols-2 gap-2">
            <input id="pName" class="border rounded px-3 py-2" placeholder="Nome">
            <input id="pLast" class="border rounded px-3 py-2" placeholder="Apelidos">
            <input id="pNick" class="border rounded px-3 py-2" placeholder="Nickname">
            <input id="pLocation" class="border rounded px-3 py-2" placeholder="Localización">
            <input id="pPassword" type="password" class="border rounded px-3 py-2" placeholder="Nova contrasinal (opcional)">
            <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Gardar</button>
          </form>
          <div id="profileMsg" class="mt-2 text-sm"></div>
        </div>
      </div>

      <div id="msg" class="mt-4 text-sm text-red-600"></div>
    </section>

    <!-- Modal de valoracións dun banco -->
    <div id="reviewsModal" class="hidden fixed inset-0 bg-black/50 items-center justify-center p-4 z-50">
      <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col">
        <header class="flex items-center justify-between p-4 border-b">
          <h3 id="reviewsModalTitle" class="font-semibold text-lg"></h3>
          <button id="closeReviewsModal" class="text-slate-400 hover:text-slate-800 text-2xl leading-none">&times;</button>
        </header>
        <div class="p-4 border-b bg-slate-50">
          <form id="reviewForm" class="grid grid-cols-1 md:grid-cols-3 gap-2">
            <input id="reviewMark" type="number" min="0" max="10" class="border rounded px-3 py-2" placeholder="Nota (0-10)" required>
            <input id="reviewNote" class="border rounded px-3 py-2 md:col-span-2" placeholder="Comentario">
            <button class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 md:col-span-3">Enviar valoración</button>
          </form>
        </div>
        <div id="reviewsModalBody" class="p-4 overflow-y-auto space-y-3"></div>
      </div>
    </div>
  </div>

<script>
const API = '';
function token(){ return localStorage.getItem('token'); }
function setToken(t){ localStorage.setItem('token', t); }
function clearToken(){ localStorage.removeItem('token'); }
function jwtPayload(){
  try{
    const part=token().split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(atob(part.padEnd(Math.ceil(part.length/4)*4,'=')));
  }catch(e){ return {}; }
}
function currentUserID(){ return jwtPayload().sub || ''; }
function currentRoles(){
  const roles=jwtPayload().roles;
  return Array.isArray(roles) ? roles.map(r=>String(r).toUpperCase()) : [];
}
function isAdmin(){
  return currentRoles().some(r=>r==='ADMIN' || r==='ROLE_ADMIN');
}
async function api(path, options={}){
  const headers = Object.assign({'Content-Type':'application/json'}, options.headers||{});
  if(token()) headers.Authorization = 'Bearer '+token();
  const r = await fetch(API+path, Object.assign(options,{headers}));
  if(!r.ok){
    let txt=''; try{txt=await r.text();}catch(e){}
    throw new Error(txt||('HTTP '+r.status));
  }
  if(r.status===204) return null;
  const ct=r.headers.get('content-type')||'';
  return ct.includes('json')? r.json(): r.text();
}

// Login
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value;
  try{
    const r = await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userID:u,password:p})});
    if(!r.ok) throw new Error('Credenciais incorrectas');
    const t = r.headers.get('authorization')||r.headers.get('Authorization');
    if(!t) throw new Error('Non se recibiu token');
    setToken(t.replace(/^Bearer /i,''));
    showApp(u);
  }catch(err){ document.getElementById('loginMsg').textContent=err.message; }
});

// Tabs login/register
function showLoginForm(){
  document.getElementById('loginForm').classList.remove('hidden');
  document.getElementById('registerForm').classList.add('hidden');
  document.getElementById('tabLogin').className='flex-1 py-2 rounded-lg text-sm font-medium bg-white shadow text-slate-900';
  document.getElementById('tabRegister').className='flex-1 py-2 rounded-lg text-sm font-medium text-slate-500';
}
function showRegisterForm(){
  document.getElementById('loginForm').classList.add('hidden');
  document.getElementById('registerForm').classList.remove('hidden');
  document.getElementById('tabRegister').className='flex-1 py-2 rounded-lg text-sm font-medium bg-white shadow text-slate-900';
  document.getElementById('tabLogin').className='flex-1 py-2 rounded-lg text-sm font-medium text-slate-500';
}
document.getElementById('tabLogin').addEventListener('click', showLoginForm);
document.getElementById('tabRegister').addEventListener('click', showRegisterForm);

document.getElementById('registerForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const u=document.getElementById('rUsername').value.trim();
  const n=document.getElementById('rName').value.trim();
  const p=document.getElementById('rPassword').value;
  try{
    const r=await fetch(API+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userID:u,name:n,password:p})});
    if(!r.ok){ let txt=''; try{txt=await r.text();}catch(e){} throw new Error(txt||'Non se puido crear a conta'); }
    // auto login
    const lr=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userID:u,password:p})});
    if(!lr.ok) throw new Error('Conta creada. Inicia sesión.');
    const t=lr.headers.get('authorization')||lr.headers.get('Authorization');
    setToken(t.replace(/^Bearer /i,''));
    showApp(u);
  }catch(err){ document.getElementById('loginMsg').textContent=err.message; }
});


document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  try{ await api('/auth/logout',{method:'POST'}); }catch(e){}
  clearToken(); showLogin();
});

function showLogin(){
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('appView').classList.add('hidden');
}
function showApp(user){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('whoami').textContent='Usuario: '+user+(isAdmin()?' · admin':'');
  loadAll();
}

// Tabs
document.querySelectorAll('.tabBtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const tab=btn.dataset.tab;
    document.querySelectorAll('.tabBtn').forEach(b=>{ b.className='tabBtn bg-slate-200 px-4 py-2 rounded'; });
    btn.className='tabBtn bg-blue-600 text-white px-4 py-2 rounded';
    document.querySelectorAll('.tabContent').forEach(c=>c.classList.add('hidden'));
    document.getElementById(tab+'Tab').classList.remove('hidden');
    if(tab==='favorites') loadFavorites();
  });
});

function msg(t,cls='text-red-600'){ const m=document.getElementById('msg'); m.textContent=t; m.className='mt-4 text-sm '+cls; }

let userFavoriteIds = new Set();
async function fetchFavoriteIds(){
  try{
    const favs = await api('/benches/favorites');
    const list = favs.content || favs || [];
    userFavoriteIds = new Set(list.map(b => b.benchID));
  }catch(e){ userFavoriteIds = new Set(); }
}

function fallbackImg(benchID){ return '/img/img'+(((benchID-1)%30)+1)+'.jpg'; }
function benchImgSrc(b){ return b.photo && b.photo.photoID ? '/photos/'+b.photo.photoID+'/image' : fallbackImg(b.benchID); }
function esc(value){ return String(value??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadBenches(){
  await fetchFavoriteIds();
  const data=await api('/benches?size=200&sort=-likes');
  const items=data.content||data;
  const grid=document.getElementById('benchGrid');
  grid.innerHTML='';
  (items||[]).forEach(b=>{
    const card=document.createElement('div');
    card.className='bg-slate-50 rounded-xl overflow-hidden shadow';
    const isFav = userFavoriteIds.has(b.benchID);
    card.innerHTML=`
      <img src="${benchImgSrc(b)}" onerror="this.onerror=null;this.src='${fallbackImg(b.benchID)}'" class="w-full h-48 object-cover cursor-pointer hover:opacity-90 transition" alt="Banco ${b.benchID}" title="Preme na foto para ver as valoracións">
      <div class="p-3 space-y-2">
        <div class="flex items-center justify-between">
          <h3 class="font-semibold">${esc(b.type)} #${b.benchID}</h3>
          <span class="text-sm text-slate-500">${esc(b.cords)}</span>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button class="likeBtn bg-pink-100 text-pink-700 px-3 py-1 rounded hover:bg-pink-200 text-sm">❤ ${b.likes??0}</button>
          <button class="favBtn ${isFav ? 'bg-amber-400 text-white' : 'bg-slate-200 text-slate-700'} px-3 py-1 rounded text-sm hover:opacity-80">
            ${isFav ? '⭐ Gardado' : '☆ Gardar'}
          </button>
          <button class="revBtn bg-indigo-100 text-indigo-700 px-3 py-1 rounded hover:bg-indigo-200 text-sm">Valoracións</button>
        </div>
        ${isAdmin() ? '<div class="flex justify-end"><button class="delBtn text-red-600 text-sm">Borrar</button></div>' : ''}
      </div>`;
    card.querySelector('img').addEventListener('click', ()=>openBenchReviews(b));
    card.querySelector('.revBtn').addEventListener('click', ()=>openBenchReviews(b));
    card.querySelector('.likeBtn').addEventListener('click', async ()=>{
      try{ await api('/benches/'+b.benchID+'/like',{method:'POST'}); loadBenches(); }catch(e){ msg(e.message); }
    });
    card.querySelector('.favBtn').addEventListener('click', async ()=>{
      try{
        if(userFavoriteIds.has(b.benchID)){
          await api('/benches/'+b.benchID+'/favorite',{method:'DELETE'});
        } else {
          await api('/benches/'+b.benchID+'/favorite',{method:'POST'});
        }
        await loadBenches();
      }catch(e){ msg(e.message); }
    });
    const delBtn=card.querySelector('.delBtn');
    if(delBtn) delBtn.addEventListener('click', async ()=>{
      if(!confirm('Borrar banco '+b.benchID+'?')) return;
      try{ await api('/benches/'+b.benchID,{method:'DELETE'}); await loadBenches(); }
      catch(e){ msg(e.message); }
    });
    grid.appendChild(card);
  });
}

async function loadFavorites(){
  try{
    const favs = await api('/benches/favorites');
    const items = favs.content || favs || [];
    const grid = document.getElementById('favoriteGrid');
    grid.innerHTML = '';
    if(items.length === 0){
      grid.innerHTML = '<p class="text-slate-500 col-span-2">Aínda non tes bancos favoritos gardados.</p>';
      return;
    }
    items.forEach(b=>{
      const card = document.createElement('div');
      card.className = 'bg-slate-50 rounded-xl overflow-hidden shadow';
      card.innerHTML = `
        <img src="${benchImgSrc(b)}" onerror="this.onerror=null;this.src='${fallbackImg(b.benchID)}'" class="w-full h-48 object-cover cursor-pointer hover:opacity-90 transition" alt="Banco ${b.benchID}" title="Preme na foto para ver as valoracións">
        <div class="p-3 space-y-2">
          <div class="flex items-center justify-between">
            <h3 class="font-semibold">${esc(b.type)} #${b.benchID}</h3>
            <span class="text-sm text-slate-500">${esc(b.cords)}</span>
          </div>
          <div class="flex flex-wrap items-center justify-between gap-2">
            <span class="text-pink-600 text-sm font-medium">❤ ${b.likes??0} likes</span>
            <div class="flex gap-2">
              <button class="favRevBtn bg-indigo-100 text-indigo-700 px-3 py-1 rounded text-sm hover:bg-indigo-200">Valoracións</button>
              <button class="removeFavBtn bg-red-100 text-red-700 px-3 py-1 rounded text-sm hover:bg-red-200">Quitar</button>
            </div>
          </div>
        </div>`;
      card.querySelector('img').addEventListener('click', ()=>openBenchReviews(b));
      card.querySelector('.favRevBtn').addEventListener('click', ()=>openBenchReviews(b));
      card.querySelector('.removeFavBtn').addEventListener('click', async ()=>{
        await api('/benches/'+b.benchID+'/favorite',{method:'DELETE'});
        loadFavorites();
      });
      grid.appendChild(card);
    });
  }catch(e){ msg(e.message); }
}

let currentBench = null;

async function openBenchReviews(b){
  currentBench = b;
  document.getElementById('reviewsModalTitle').textContent='Valoracións do banco #'+b.benchID+' ('+b.type+')';
  document.getElementById('reviewMark').value='';
  document.getElementById('reviewNote').value='';
  const modal=document.getElementById('reviewsModal');
  modal.classList.remove('hidden');
  modal.classList.add('flex');
  await loadBenchReviews();
}

async function loadBenchReviews(){
  const body=document.getElementById('reviewsModalBody');
  if(!currentBench) return;
  body.innerHTML='<p class="text-slate-500">Cargando...</p>';
  try{
    const data=await api('/valoraciones?benchId='+currentBench.benchID+'&size=200');
    const items=(data.content||data||[]).slice().sort((a,c)=>String(c.date||'').localeCompare(String(a.date||'')));
    body.innerHTML='';
    if(items.length===0){ body.innerHTML='<p class="text-slate-500">Este banco aínda non ten valoracións.</p>'; return; }
    items.forEach(r=>{
      const u=r.reviewer||{};
      const nombre=[u.name,u.lastName].filter(Boolean).join(' ');
      const el=document.createElement('div');
      el.className='border rounded-xl p-3 bg-slate-50';
      el.innerHTML=`
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="font-semibold">@${esc(u.userID||'descoñecido')}${nombre?' <span class="font-normal text-slate-500">· '+esc(nombre)+'</span>':''}</p>
            <p class="text-xs text-slate-500">${esc(r.date||'')}</p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="bg-indigo-600 text-white text-sm font-semibold px-2.5 py-1 rounded-lg">${esc(r.mark)}/10</span>
            ${isAdmin()?'<button class="delReviewBtn text-red-600 text-sm">Borrar</button>':''}
          </div>
        </div>
        ${r.note?'<p class="mt-2 text-slate-700">'+esc(r.note)+'</p>':''}`;
      const delBtn=el.querySelector('.delReviewBtn');
      if(delBtn) delBtn.addEventListener('click', async ()=>{
        if(!confirm('Borrar a valoración #'+r.reviewId+'?')) return;
        try{ await api('/valoraciones/'+r.reviewId,{method:'DELETE'}); await loadBenchReviews(); }
        catch(err){ msg(err.message); }
      });
      body.appendChild(el);
    });
  }catch(err){ body.innerHTML='<p class="text-red-600">'+esc(err.message)+'</p>'; }
}

function closeReviewsModal(){
  const modal=document.getElementById('reviewsModal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
  currentBench = null;
}
document.getElementById('closeReviewsModal').addEventListener('click', closeReviewsModal);
document.getElementById('reviewsModal').addEventListener('click', (e)=>{ if(e.target.id==='reviewsModal') closeReviewsModal(); });

function readImageFile(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('Non se puido ler a foto'));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('O ficheiro non é unha imaxe válida'));
      img.onload=()=>resolve({
        data: reader.result,
        resolution: img.naturalWidth+'x'+img.naturalHeight,
        contentType: file.type||'image/jpeg',
        size: file.size
      });
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById('benchPhoto').addEventListener('change', (e)=>{
  const file=e.target.files && e.target.files[0];
  const preview=document.getElementById('benchPhotoPreview');
  if(!file){ preview.classList.add('hidden'); preview.removeAttribute('src'); return; }
  preview.src=URL.createObjectURL(file);
  preview.classList.remove('hidden');
});

document.getElementById('benchForm').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const cords=document.getElementById('benchCords').value.trim();
  const type=document.getElementById('benchType').value.trim();
  const fileInput=document.getElementById('benchPhoto');
  try{
    let photo=null;
    if(fileInput.files && fileInput.files[0]){
      const img=await readImageFile(fileInput.files[0]);
      photo=await api('/photos',{method:'POST',body:JSON.stringify({resolution:img.resolution,size:img.size,contentType:img.contentType,data:img.data})});
    }
    await api('/benches',{method:'POST',body:JSON.stringify({cords,type,photo: photo?{photoID:photo.photoID}:null})});
    document.getElementById('benchCords').value='';
    document.getElementById('benchType').value='';
    fileInput.value='';
    const preview=document.getElementById('benchPhotoPreview');
    preview.classList.add('hidden');
    preview.removeAttribute('src');
    msg('Banco engadido','text-green-600');
    await loadBenches();
  }catch(err){ msg(err.message); }
});

document.getElementById('reviewForm').addEventListener('submit', async(e)=>{
  e.preventDefault();
  if(!currentBench) return;
  try{
    await api('/valoraciones',{method:'POST',body:JSON.stringify({
      reviewer:{userID:currentUserID()},
      benchOfReview:{benchID:currentBench.benchID},
      mark:Number(document.getElementById('reviewMark').value),
      note:document.getElementById('reviewNote').value
    })});
    document.getElementById('reviewMark').value='';
    document.getElementById('reviewNote').value='';
    msg('Valoración enviada','text-green-600');
    await loadBenchReviews();
  }catch(err){ msg(err.message); }
});

async function loadProfile(){
  const sub=currentUserID();
  const u=await api('/users/'+sub);
  document.getElementById('pName').value=u.name||'';
  document.getElementById('pLast').value=u.lastName||'';
  document.getElementById('pNick').value=u.nickname||'';
  document.getElementById('pLocation').value=u.location||'';
  document.getElementById('profileForm').onsubmit=async(ev)=>{
    ev.preventDefault();
    const body={userID:sub,name:document.getElementById('pName').value,lastName:document.getElementById('pLast').value,nickname:document.getElementById('pNick').value,location:document.getElementById('pLocation').value};
    const pw=document.getElementById('pPassword').value;
    if(pw) body.password=pw;
    await api('/users/'+sub,{method:'PUT',body:JSON.stringify(body)});
    document.getElementById('profileMsg').textContent='Perfil actualizado'; document.getElementById('profileMsg').className='mt-2 text-sm text-green-600';
  };
}

async function loadAll(){
  try{ await loadBenches(); await loadProfile(); }
  catch(e){ msg(e.message); if(e.message.includes('401')){ clearToken(); showLogin(); } }
}

// Ao iniciar a aplicación móstrase sempre a pantalla de login.
clearToken();
showLogin();
</script>
</body>
